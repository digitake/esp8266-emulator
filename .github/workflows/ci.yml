name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with GCC
        run: make -j2 CC=gcc
      - name: Sanitizers, Python tests and synthetic watchdog
        run: make -j2 check CC=gcc

  network:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install network build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libslirp-dev libglib2.0-dev pkg-config
      - name: Build and check the network backend
        run: make -j2 network check-network-backend CC=gcc

  macos:
    runs-on: macos-14   # Apple Silicon
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with Apple clang
        run: make -j3
      - name: Sanitizers, Python tests and synthetic watchdog
        # Logs need a sign-in; an annotation with the end of a failing run shows on the public run page.
        run: |
          make check > check.log 2>&1 && exit 0
          tail -n 60 check.log
          python3 -c "import sys; t = sys.stdin.read()[-3500:]; print('::error title=make check failed::' + t.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))" < check.log
          exit 1
      - name: Network runner with Homebrew libslirp
        run: |
          brew install libslirp pkg-config
          make -j3 network check-network-backend
