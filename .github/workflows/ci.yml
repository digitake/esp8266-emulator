name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build with GCC
        run: make -j2 CC=gcc
      - name: Sanitizers, Python tests and synthetic watchdog
        run: make -j2 check CC=gcc
