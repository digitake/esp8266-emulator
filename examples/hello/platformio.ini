; A first firmware image for the ESP8266 emulator. Build it with `pio run`;
; the image lands in .pio/build/esp12e/firmware.bin, next to firmware.elf.
; Platform 4.2.1 ships Arduino core 3.1.2, the core the emulator was developed around.
[env:esp12e]
platform = espressif8266@4.2.1
board = esp12e
framework = arduino
monitor_speed = 115200
